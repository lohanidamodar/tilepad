name: Release

# Three ways to cut a release (all publish the same artifacts — Android APK,
# Windows installer + portable zip, Linux tarball):
#   1. push a tag like `v1.2.3`,
#   2. run the workflow from the Actions tab with a version input, or
#   3. push/create a branch named `release/v1.2.3` (handy for integrations
#      that can create branches but not tags or dispatch workflows).
# For 2 and 3 the release step creates the tag itself.
on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.0 (creates tag v<version>)"
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.0"
  # The tag the release is published under: v<input> for manual dispatches,
  # the tag itself for tag pushes, and v<x.y.z> for release/v<x.y.z> branches
  # (resolved per job below since expressions have no string-strip function).
  DISPATCH_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Resolve release tag
        shell: bash
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            tag="v$DISPATCH_VERSION"
          else
            ref="$GITHUB_REF_NAME"
            tag="${ref#release/}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing as $tag"
      - name: Build Android APK (client)
        run: flutter build apk --release --no-tree-shake-icons -t lib/src/client/main.dart
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MarcoDeck-client.apk
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/app/outputs/flutter-apk/MarcoDeck-client.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop
      - name: Flutter pub get
        run: flutter pub get
      - name: Resolve release tag
        shell: bash
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            tag="v$DISPATCH_VERSION"
          else
            ref="$GITHUB_REF_NAME"
            tag="${ref#release/}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing as $tag"
      - name: Compile bundled OBS plugin (refresh the committed binary)
        run: dart compile exe assets/plugins/obs/plugin.dart -o assets/plugins/obs/obs-plugin.exe
      - name: Build Windows release (server)
        run: flutter build windows --release -t lib/src/server/main.dart
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ env.RELEASE_TAG }}"
          $version = if ($ref -match '^v\d') { $ref.TrimStart('v') } else { '0.0.0-dev' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "windows\installer\marcodeck.iss"
      - name: Archive portable Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build\artifacts -Force | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/artifacts/MarcoDeck-windows-portable.zip"
      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            windows/installer/output/MarcoDeck-Setup-${{ steps.version.outputs.version }}.exe
            build/artifacts/MarcoDeck-windows-portable.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop
      - name: Flutter pub get
        run: flutter pub get
      - name: Resolve release tag
        shell: bash
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            tag="v$DISPATCH_VERSION"
          else
            ref="$GITHUB_REF_NAME"
            tag="${ref#release/}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing as $tag"
      - name: Compile bundled OBS plugin (standalone binary, no Dart SDK needed on target)
        run: dart compile exe assets/plugins/obs/plugin.dart -o assets/plugins/obs/obs-plugin
      - name: Build Linux release (server)
        run: flutter build linux --release -t lib/src/server/main.dart
      - name: Archive Linux build
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/MarcoDeck-linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Upload Linux artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/MarcoDeck-linux.tar.gz
