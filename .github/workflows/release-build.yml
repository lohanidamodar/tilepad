name: Release Builds

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Android dependencies
        run: flutter doctor
      - name: Flutter pub get
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons -t lib/src/client/main.dart
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop
      - name: Flutter pub get
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release -t lib/src/server/main.dart
      - name: Archive Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build\artifacts -Force | Out-Null
          $zipPath = "build/artifacts/marcodeck-windows.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zipPath
      - name: Upload Windows artifact
        uses: softprops/action-gh-release@v2
        with:
          files: build/artifacts/marcodeck-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop
      - name: Flutter pub get
        run: flutter pub get
      - name: Build Linux release
        run: flutter build linux --release -t lib/src/server/main.dart
      - name: Archive Linux build
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/marcodeck-linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Upload Linux artifact
        uses: softprops/action-gh-release@v2
        with:
          files: build/artifacts/marcodeck-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
