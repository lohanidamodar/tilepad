name: Release

# Push a tag like `v1.2.3` to cut a release: this creates the GitHub Release
# and attaches the Android APK (client) plus Windows and Linux server builds —
# including a Windows installer (Inno Setup). Can also be run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Build Android APK (client)
        run: flutter build apk --release --no-tree-shake-icons -t lib/src/client/main.dart
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MarcoDeck-client.apk
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/MarcoDeck-client.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop
      - name: Flutter pub get
        run: flutter pub get
      - name: Build Windows release (server)
        run: flutter build windows --release -t lib/src/server/main.dart
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $version = if ($ref -match '^v\d') { $ref.TrimStart('v') } else { '0.0.0-dev' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "windows\installer\marcodeck.iss"
      - name: Archive portable Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build\artifacts -Force | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/artifacts/MarcoDeck-windows-portable.zip"
      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            windows/installer/output/MarcoDeck-Setup-${{ steps.version.outputs.version }}.exe
            build/artifacts/MarcoDeck-windows-portable.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop
      - name: Flutter pub get
        run: flutter pub get
      - name: Build Linux release (server)
        run: flutter build linux --release -t lib/src/server/main.dart
      - name: Archive Linux build
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/MarcoDeck-linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Upload Linux artifact to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/artifacts/MarcoDeck-linux.tar.gz
