name: Release

# Builds the release artifacts (Android APK, Windows installer + portable
# zip, Linux tarball) and attaches them to the GitHub release:
#   - publish a release (the usual flow): the artifacts are uploaded to it,
#     and the matching CHANGELOG.md section becomes the notes if the release
#     was created without a body,
#   - pushing a `v*` tag or dispatching with a version input also works;
#     those create the release themselves, with changelog notes,
#   - pushing a branch named `release/v<x.y.z>` does the same — a fallback
#     for automation that can publish branches but not releases, tags or
#     dispatches. The branch is only the trigger (deletable right after);
#     the workflow creates the real `v<x.y.z>` tag itself.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.0 (creates tag v<version>)"
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  # Resolves the tag and whether to fill in release notes, so the build jobs
  # stay trigger-agnostic.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      notes: ${{ steps.resolve.outputs.notes }}
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          # Via env, not inline interpolation — bodies and tag names are
          # user-controlled text.
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_BODY: ${{ github.event.release.body }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          notes=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v$INPUT_VERSION"
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag="$EVENT_TAG"
            # Keep notes the release was published with; only fill in the
            # changelog section when the body was left empty.
            if [ -n "$EVENT_BODY" ]; then notes=false; fi
          else
            # A v* tag push, or a release/v* branch push (strip the prefix).
            tag="${GITHUB_REF_NAME#release/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (write notes: $notes)"

  build-apk:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > release-notes.md
          fi
      - name: Build Android APK (client)
        run: flutter build apk --release --no-tree-shake-icons -t lib/src/client/main.dart
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Tilepad-client.apk
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ needs.prepare.outputs.notes == 'true' && 'release-notes.md' || '' }}
          files: build/app/outputs/flutter-apk/Tilepad-client.apk

  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop
      - name: Flutter pub get
        run: flutter pub get
      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > release-notes.md
          fi
      - name: Compile bundled OBS plugin (refresh the committed binary)
        run: dart compile exe assets/plugins/obs/plugin.dart -o assets/plugins/obs/obs-plugin.exe
      - name: Build Windows release (server)
        run: flutter build windows --release -t lib/src/server/main.dart
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ env.RELEASE_TAG }}"
          $version = if ($ref -match '^v\d') { $ref.TrimStart('v') } else { '0.0.0-dev' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "windows\installer\tilepad.iss"
      - name: Archive portable Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build\artifacts -Force | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/artifacts/Tilepad-windows-portable.zip"
      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ needs.prepare.outputs.notes == 'true' && 'release-notes.md' || '' }}
          files: |
            windows/installer/output/Tilepad-Setup-${{ steps.version.outputs.version }}.exe
            build/artifacts/Tilepad-windows-portable.zip

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop
      - name: Flutter pub get
        run: flutter pub get
      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > release-notes.md
          fi
      - name: Compile bundled OBS plugin (standalone binary, no Dart SDK needed on target)
        run: dart compile exe assets/plugins/obs/plugin.dart -o assets/plugins/obs/obs-plugin
      - name: Build Linux release (server)
        run: flutter build linux --release -t lib/src/server/main.dart
      - name: Archive Linux build
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/Tilepad-linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Upload Linux artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ needs.prepare.outputs.notes == 'true' && 'release-notes.md' || '' }}
          files: build/artifacts/Tilepad-linux.tar.gz
