name: marco_deck
description: "A Flutter app to remotely execute commands from a mobile client to a server."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^2.4.0  # For WebSocket communication
  process_run: ^0.13.3  # For executing shell commands
  shared_preferences: ^2.2.2  # For storing preferences
  path_provider: ^2.1.1  # For file system access
  font_awesome_flutter: ^10.6.0  # For custom icons
  provider: ^6.1.1  # For state management
  flutter_riverpod: ^2.4.9  # For improved state management
  uuid: ^3.0.7  # For generating unique IDs
  win32: ^5.12.0
  ffi: ^2.1.4
  flutter_colorpicker: ^1.1.0  # For color picking in button group editor
  system_tray: ^2.0.3  # For system tray integration
  window_manager: ^0.4.3  # For window management integration
  intl: ^0.19.0  # For date formatting
  smooth_page_indicator: ^1.1.0  # For page indicators in multi-page view

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
