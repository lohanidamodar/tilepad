name: marco_deck
description: "An open source, Flutter-based alternative to Touch Portal for running a desktop macro server controlled by mobile and web clients."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3  # For WebSocket communication
  process_run: ^1.2.4  # For executing shell commands
  shared_preferences: ^2.2.2  # For storing preferences
  path_provider: ^2.1.1  # For file system access
  provider: ^6.1.1  # For state management
  flutter_riverpod: ^3.0.3 # For improved state management
  uuid: ^4.0.0  # For generating unique IDs
  win32: ^6.3.0
  ffi: ^2.1.4
  flutter_colorpicker: ^1.1.0  # For color picking in button group editor
  tray_manager: ^0.5.2  # For system tray integration
  window_manager: ^0.5.1  # For window management integration
  intl: ^0.20.2  # For date formatting
  smooth_page_indicator: ^2.0.1  # For page indicators in multi-page view
  wakelock_plus: ^1.6.1  # For keeping the screen awake
  picons: ^3.0.1
  archive: ^4.0.9
  path: ^1.9.1
  desktop_drop: ^0.7.1
  file_selector: ^1.1.0
  google_fonts: ^8.1.0
  flutter_staggered_grid_view: ^0.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.0  # For generating app icons

flutter:
  uses-material-design: true

  assets:
    - assets/
    # First-party plugins bundled with the app and seeded into the plugins
    # folder on first run (one directory entry per bundled plugin).
    - assets/plugins/obs/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

icons_launcher:
  image_path: "assets/logo.png"
  platforms:
    android:
      enable: true
      image_path: "assets/logo.png"
      adaptive_background_color: "#4285F4"
      adaptive_foreground_image: "assets/logo.png"
      adaptive_round_image: "assets/logo.png"
    ios:
      enable: true
      image_path: "assets/logo.png"
    macos:
      enable: true
      image_path: "assets/logo.png"
    windows:
      enable: true
      image_path: "assets/logo.png"
    linux:
      enable: true
      image_path: "assets/logo.png"
    web:
      enable: true
      image_path: "assets/logo.png"
